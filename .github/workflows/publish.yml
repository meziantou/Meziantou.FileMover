name: publish
on:
  workflow_dispatch:
  push:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

    - name: Test
      run: dotnet test

    - name: Build (arm64)
      run: dotnet publish Meziantou.FileMover/Meziantou.FileMover.csproj --configuration Release --runtime win-arm64 --output ${{ github.workspace }}/publish/win-arm64

    - name: Build (x64)
      run: dotnet publish Meziantou.FileMover/Meziantou.FileMover.csproj --configuration Release --runtime win-x64 --output ${{ github.workspace }}/publish/win-x64

    - name: Create zip files
      run: |
        Compress-Archive -Path "${{ github.workspace }}/publish/win-x64/*" -DestinationPath "${{ github.workspace }}/publish/Meziantou.FileMover-win-x64.zip"
        Compress-Archive -Path "${{ github.workspace }}/publish/win-arm64/*" -DestinationPath "${{ github.workspace }}/publish/Meziantou.FileMover-win-arm64.zip"

    - name: upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: publish-windows
        path: |
          ${{ github.workspace }}/publish/Meziantou.FileMover-win-x64.zip
          ${{ github.workspace }}/publish/Meziantou.FileMover-win-arm64.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

    - name: Test
      run: dotnet test

    - name: Build (macos-arm64)
      run: dotnet publish Meziantou.FileMover/Meziantou.FileMover.csproj --configuration Release --runtime osx-arm64 --self-contained true --output ${{ github.workspace }}/publish/macos-arm64

    - name: Create zip file
      run: ditto -c -k --keepParent "${{ github.workspace }}/publish/macos-arm64" "${{ github.workspace }}/publish/Meziantou.FileMover-macos-arm64.zip"

    - name: upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: publish-macos-arm64
        path: ${{ github.workspace }}/publish/Meziantou.FileMover-macos-arm64.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
    - build-windows
    - build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: publish-windows
        path: ${{ github.workspace }}/publish
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: publish-macos-arm64
        path: ${{ github.workspace }}/publish

    - run: |
        gh release view "$ReleaseName" || gh release create "$ReleaseName" --generate-notes
        gh release upload "$ReleaseName" \
          "${{ github.workspace }}/publish/Meziantou.FileMover-win-x64.zip" \
          "${{ github.workspace }}/publish/Meziantou.FileMover-win-arm64.zip" \
          "${{ github.workspace }}/publish/Meziantou.FileMover-macos-arm64.zip"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ReleaseName: ${{ github.ref_name }}
